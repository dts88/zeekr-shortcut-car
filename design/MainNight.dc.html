<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, "Noto Sans SC", "PingFang SC", sans-serif; }
    a { color: #4FC3D9; } a:hover { color: #7ad5e6; }
  </style>
</helmet>
<div style="width: 1600px; height: 1060px; box-sizing: border-box; background: #0E1315; display: flex; flex-direction: column;">

  <div style="padding: 12px 20px 8px; display: flex; align-items: baseline; gap: 12px;">
    <div style="font-size: 14px; font-weight: 600; color: #E8EDF0;">主界面 · 夜间</div>
    <div style="font-size: 12px; color: #6B767D;">同一份布局，只换主题；跟随系统昼夜</div>
  </div>

  <div style="flex-grow: 1; margin: 0 12px 12px; background: #161C1F; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; gap: 14px; border-bottom: 1px solid #2A3338;">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #1E262A; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </div>
      <div style="font-size: 18px; font-weight: 600; color: #E8EDF0;">环视记录</div>
      <div style="font-size: 13px; color: #6B767D;">极氪7X · 合成流</div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 20px; background: #33201C;">
        <div style="width: 8px; height: 8px; border-radius: 4px; background: #E9705C;"></div>
        <div style="font-size: 13px; color: #F0A597; font-variant-numeric: tabular-nums;">录制中 00:14:22</div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; padding: 12px; gap: 12px;">

      <div style="flex-grow: 1; position: relative; background: #1A2226; border-radius: 12px; overflow: hidden;">
        <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 3px;">
          <div style="background: #2C383E;"></div>
          <div style="background: #263136;"></div>
          <div style="background: #263136;"></div>
          <div style="background: #2C383E;"></div>
        </div>
        <div style="position: absolute; left: 14px; top: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(232,237,240,0.12); color: #E8EDF0; font-size: 14px;">前</div>
        <div style="position: absolute; left: 50%; margin-left: 14px; top: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(232,237,240,0.12); color: #E8EDF0; font-size: 14px;">后</div>
        <div style="position: absolute; left: 14px; top: 50%; margin-top: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(232,237,240,0.12); color: #E8EDF0; font-size: 14px;">左</div>
        <div style="position: absolute; left: 50%; margin-left: 14px; top: 50%; margin-top: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(232,237,240,0.12); color: #E8EDF0; font-size: 14px;">右</div>
        <div style="position: absolute; right: 14px; top: 12px; padding: 6px 12px; border-radius: 8px; background: #17323A; color: #4FC3D9; font-size: 13px;">这一格正在录</div>
      </div>

      <div style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px;">

        <div style="height: 132px; border-radius: 16px; background: #2A1A17; display: flex; align-items: center; padding: 0 22px; gap: 18px;">
          <div style="width: 68px; height: 68px; flex-shrink: 0;">
            <svg width="68" height="68" viewBox="0 0 68 68">
              <circle cx="34" cy="34" r="30" fill="none" stroke="#4A2A24" stroke-width="4"/>
              <path d="M34 4 A30 30 0 1 1 12.1 54.5" fill="none" stroke="#E9705C" stroke-width="4" stroke-linecap="round"/>
              <rect x="24" y="24" width="20" height="20" rx="5" fill="#E9705C"/>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="font-size: 22px; font-weight: 600; color: #E8EDF0;">停止录制</div>
            <div style="font-size: 13px; color: #9AA6AD; font-variant-numeric: tabular-nums;">本段 00:38 / 1 分钟</div>
            <div style="font-size: 12px; color: #6B767D;">环走满一圈，换下一段</div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <div style="height: 104px; border-radius: 16px; background: #1E262A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.7"><circle cx="12" cy="13" r="4"/><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.3-2h7l1.3 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" stroke-linejoin="round"/></svg>
            <div style="font-size: 14px; color: #E8EDF0;">拍照</div>
          </div>
          <div style="height: 104px; border-radius: 16px; background: #1E262A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15M3.5 12h17"/></svg>
            <div style="font-size: 14px; color: #E8EDF0;">单画面</div>
          </div>
          <div style="height: 104px; border-radius: 16px; background: #1E262A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z"/></svg>
            <div style="font-size: 14px; color: #E8EDF0;">视频回看</div>
          </div>
          <div style="height: 104px; border-radius: 16px; background: #1E262A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15.5l4.5-4 3.5 3 3.5-3.5L21 15"/><circle cx="8.5" cy="9.5" r="1.3"/></svg>
            <div style="font-size: 14px; color: #E8EDF0;">图片回看</div>
          </div>
        </div>

        <div style="margin-top: auto; display: flex; gap: 12px;">
          <div style="flex-grow: 1; height: 72px; border-radius: 16px; background: #1E262A; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EDF0" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6"/></svg>
            <div style="font-size: 15px; color: #E8EDF0;">设置</div>
          </div>
          <div style="width: 72px; height: 72px; border-radius: 16px; background: #1E262A; display: flex; align-items: center; justify-content: center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA6AD" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </div>
        </div>

      </div>

    </div>

    <div style="height: 48px; flex-shrink: 0; border-top: 1px solid #2A3338; display: flex; align-items: center; padding: 0 18px; gap: 26px;">
      <div style="font-size: 13px; color: #9AA6AD; font-variant-numeric: tabular-nums;">1280×5140 → 落盘 2560×2570</div>
      <div style="font-size: 13px; color: #9AA6AD; font-variant-numeric: tabular-nums;">30 fps · H.265 · 中码率</div>
      <div style="font-size: 13px; color: #9AA6AD; font-variant-numeric: tabular-nums;">U 盘 62.4 GB 可用</div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
        <div style="width: 200px; height: 4px; border-radius: 2px; background: #2A3338; overflow: hidden;"><div style="width: 63%; height: 4px; background: #4FC3D9;"></div></div>
        <div style="font-size: 12px; color: #6B767D;">本段 63%</div>
      </div>
    </div>

  </div>

  <div style="padding: 0 20px 12px; display: flex; gap: 24px;">
    <div style="font-size: 12px; color: #9AA6AD;">夜间不是把日间反色：正文 #E8EDF0 而非纯白，能量色提亮到 #4FC3D9 才够对比</div>
    <div style="font-size: 12px; color: #9AA6AD;">分层靠明度，无阴影 —— 少一层绘制</div>
  </div>

</div>
</x-dc>
</body>
</html>
