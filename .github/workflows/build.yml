name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.path }}
      version: ${{ steps.apk.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会装模拟器，我们只是编译 APK 用不到它；
          # 而且它下载失败过一次（Error on ZipFile unknown archive），
          # 白白多一个失败点。Gradle 会自行拉取真正需要的 SDK 组件。
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 纯 JVM 单元测试：合成流几何拆分与相机选择逻辑
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 用仓库里的公开测试密钥签：只用来检查、试装。正式版由下面的 release 任务重新签名
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          VERSION=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          OUT="ZeekrShortcut-${VERSION}-${SHORT_SHA}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeekrShortcut-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  # 打 tag 时发布：用项目所有者的私有密钥重新签名（从公开测试密钥轮换过去，见 sign_release.sh），再建 Release。
  # 私钥只在 release 环境里，那个环境只许 v* 标签用：PR、main 的构建拿不到它。没配好就失败，不会发出只用测试密钥签的版本。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ZeekrShortcut-apk
          path: unsigned

      - name: Sign with the release key
        env:
          APK: ${{ needs.build.outputs.apk }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::release 环境里没有 RELEASE_KEYSTORE_B64（见 .github/scripts/release_key.py）"
            exit 1
          fi
          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$RELEASE_KEYSTORE"' EXIT
          (umask 077 && printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE")
          bash .github/scripts/sign_release.sh "unsigned/$APK" "$APK"

      # Release 正文由 CHANGELOG.md 里对应版本的小节自动生成，
      # 这样每个版本的说明就是它自己的改动，而不是每次都一样的模板。
      - name: Build release notes
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py "${{ needs.build.outputs.version }}" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.build.outputs.apk }}
          # 带后缀的（-alpha / -beta）是测试版；1.0.0 这种不带后缀的是正式版，显示为 Latest
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          # 2026-09-29 起所有新版本一律不公开：建成草稿，只有仓库所有者能看到和下载
          draft: true
          name: ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md

  # 手动触发（workflow_dispatch）时把发布用的签名走一遍：一次性密钥（release_key.py self-test）
  # 加 sign_release.sh 的全部核对。改签名脚本、换工具版本之后跑一次；不发布任何东西。
  signing-self-test:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ZeekrShortcut-apk
          path: unsigned

      - name: Sign with a throwaway key
        env:
          APK: ${{ needs.build.outputs.apk }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          export RELEASE_KEYSTORE="$RUNNER_TEMP/self-test.p12"
          RELEASE_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
          export RELEASE_KEYSTORE_PASSWORD
          RELEASE_CERT_SHA256=$("$RUNNER_TEMP/venv/bin/python" .github/scripts/release_key.py self-test "$RELEASE_KEYSTORE")
          export RELEASE_CERT_SHA256
          bash .github/scripts/sign_release.sh "unsigned/$APK" "$RUNNER_TEMP/$APK"
